name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  ho-so:
    name: Hồ sơ & cấu hình
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config hợp lệ
        run: docker compose -f infra/docker-compose.yml config -q
      - name: .env.example không chứa khoá thật
        run: |
          if grep -Eiq '(AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,})' .env.example; then
            echo "Phát hiện chuỗi giống khoá thật trong .env.example"; exit 1; fi
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "docs/**/*.md README.md"
        continue-on-error: true

  api:
    name: API — lint, type-check, test, e2e, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarttask
          POSTGRES_PASSWORD: smarttask
          POSTGRES_DB: smarttask
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U smarttask -d smarttask"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://smarttask:smarttask@localhost:5434/smarttask?schema=public
      DIRECT_URL: postgresql://smarttask:smarttask@localhost:5434/smarttask?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run shared:build
      - run: npm run db:generate
      - name: Lint
        run: npm run api:lint -- --max-warnings=0
      - name: Type-check
        run: npx tsc --noEmit -p apps/api/tsconfig.json
      - name: Prisma validate
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Unit test
        run: npm run api:test
      - name: Migration áp lên CSDL sạch
        run: npm run db:deploy
      - name: E2E
        run: npm run api:test:e2e
      - name: Build
        run: npm run api:build
