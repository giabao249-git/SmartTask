name: Check Branch Naming Convention

on:
  push:
    branches:
      - '**'
      - '!main' # Bỏ qua nhánh main

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name format
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          # sprint_vN: nhánh tích hợp một sprint (sprint_v0, sprint_v1, …) — xem docs/00-quy-che/quy-tac-git.md
          REGEX="^(sprint_v[0-9]+|sprint/.+|feature/.+|chore/.+|bugfix/.+|release/.+|hotfix/.+)$"

          if [[ ! "$BRANCH_NAME" =~ $REGEX ]]; then
            echo "::error::Tên branch '$BRANCH_NAME' không hợp lệ. Dùng một trong: sprint_vN (vd. sprint_v0), sprint/…, feature/…, chore/…, bugfix/…, release/…, hotfix/…"
            exit 1
          fi
          echo "Tên branch hợp lệ: $BRANCH_NAME"
