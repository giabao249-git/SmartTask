# Môi trường phát triển cục bộ — Tuần 02
# Chạy:  docker compose -f infra/docker-compose.yml up -d   (hoặc: make db-up)
# Dữ liệu nằm trong volume smarttask_pgdata; xoá bằng: make db-reset
name: smarttask

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarttask-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smarttask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarttask}
      POSTGRES_DB: ${POSTGRES_DB:-smarttask}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smarttask} -d ${POSTGRES_DB:-smarttask}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Giao diện quản trị nhẹ (http://localhost:8080) — tuỳ chọn, bật bằng: make db-ui
  adminer:
    image: adminer:4
    container_name: smarttask-adminer
    profiles: ["ui"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

  # Elasticsearch cho @mention (tuỳ chọn, bật bằng: make search-up). Cần ~1 GB RAM.
  # Không có trên Render/Supabase free → API tự rơi về pg_trgm khi không kết nối được.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: smarttask-elasticsearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.routing.allocation.disk.threshold_enabled: "false"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  esdata:
